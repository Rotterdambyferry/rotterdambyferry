name: Bouw en publiceer

# Draait de buildstap (node build.js) en zet het resultaat op GitHub Pages.
# Dat gebeurt in drie gevallen:
#  - bij elke push naar main (zoals nu al gebeurt via "Deploy from a branch");
#  - elke ochtend automatisch, zodat een voorbereide post met een
#    publicatiedatum vanzelf verschijnt zonder dat iemand hoeft te pushen
#    (zie "Voorbereide posts publiceren op datum" in CLAUDE.md);
#  - handmatig via de knop "Run workflow" hierboven op GitHub.
#
# Alleen de bestanden die echt bij de site horen worden gepubliceerd (zie de
# stap "Publiceerbare bestanden verzamelen"): de map src/ met eventuele nog
# niet gepubliceerde posts blijft dus buiten bereik.

on:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC = 07:00 of 08:00 Nederlandse tijd, afhankelijk van zomer-/
    # wintertijd. Het exacte tijdstip maakt niet uit, dit is gewoon "'s ochtends".
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Voorkomt dat twee publicaties tegelijk lopen; een wachtende run hoeft niet
# geannuleerd te worden, want elke run publiceert toch de complete, actuele
# site opnieuw.
concurrency:
  group: pages
  cancel-in-progress: false

# Twee jobs (sinds november 2026): "bouw" maakt de site en uploadt hem als
# artifact, "publiceer" zet hem daarna online. Reden: deploy-pages vond de
# artifact soms niet terug als hij direct na de upload in dezelfde job vroeg
# (run 45704346726: upload klaar, een halve seconde later "Found 0
# artifact(s)"). De aparte job, een wachtstap en zo nodig een tweede poging
# vangen dat op. Secrets voor de build (BEHOLD_FEED_URL, INSTAGRAM_TOKEN)
# moeten repository-secrets zijn: de job "bouw" draait niet in de environment
# github-pages en ziet environment-secrets dus niet.
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volledige git-geschiedenis nodig voor <lastmod> in sitemap.xml

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Laatste Instagram-posts voor de pagina Snapshots uit 010
      # (instagram.html), via de JSON-feed van Behold (secret BEHOLD_FEED_URL;
      # INSTAGRAM_TOKEN is de reserve voor de officiële API). Zonder bron of
      # bij een fout gaat de publicatie gewoon door: de pagina toont dan de
      # lege stand.
      - name: Instagram ophalen
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node haal-instagram.js

      - name: Site bouwen
        run: node build.js

      - name: Publiceerbare bestanden verzamelen
        run: |
          mkdir _site
          cp index.html over.html kaart.html instagram.html 404.html favicon.ico sitemap.xml robots.txt places.json google943d5d50987785df.html _site/
          [ -f CNAME ] && cp CNAME _site/
          cp -r posts assets _site/

      - name: Pages instellen
        uses: actions/configure-pages@v5

      - name: Artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url || steps.publicatie2.outputs.page_url }}
    steps:
      - name: Wachten tot de artifact zichtbaar is
        run: sleep 20

      # Eerste poging. Mislukt die (bijvoorbeeld weer "Found 0 artifact(s)"),
      # dan gaat de job door naar de tweede poging hieronder. Die fout valt
      # voordat er een deployment is aangemaakt, dus opnieuw proberen is veilig.
      - name: Publiceren
        id: publicatie
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Nog even wachten
        if: steps.publicatie.outcome == 'failure'
        run: sleep 30

      # Tweede en laatste poging; mislukt deze ook, dan wordt de run rood.
      - name: Publiceren (tweede poging)
        id: publicatie2
        if: steps.publicatie.outcome == 'failure'
        uses: actions/deploy-pages@v4
